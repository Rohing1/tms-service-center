name: Publish TMS release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (for example v1.0.0)'
        required: true
        default: v1.0.0
        type: string

concurrency:
  group: tms-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.meta.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use vMAJOR.MINOR.PATCH'; exit 1; }
          if gh release view "$VERSION" --json isDraft --jq '.isDraft' > /tmp/is-draft 2>/dev/null; then
            [[ "$(cat /tmp/is-draft)" == true ]] || { echo 'Published versions are immutable; choose a new version'; exit 1; }
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)" == "$GITHUB_SHA" ]] || { echo 'Draft belongs to another commit'; exit 1; }
          fi
          echo "images=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - name: Backend regression tests
        working-directory: springboot-backend
        run: mvn -B -Dtest=ServiceCenterServiceTest,ServiceCenterControllerTest,RenewalPolicyTest,LineDetailServiceTest,LineDetailControllerTest test-compile org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test
      - name: Shell syntax
        run: bash -n install.sh && bash -n panel_install.sh && bash -n tms-hybrid.sh

  images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [springboot-backend, vite-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build-time
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate.outputs.images }}/${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ inputs.version }}
            BUILD_TIME=${{ steps.build-time.outputs.timestamp }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  node:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum
      - name: Build Linux node binaries
        working-directory: go-gost
        run: |
          mkdir -p ../release-assets
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -ldflags '-s -w' -o ../release-assets/gost-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath -ldflags '-s -w' -o ../release-assets/gost-arm64 .
      - name: Bundle installation files and checksums
        run: |
          cp install.sh panel_install.sh docker-compose-v4.yml docker-compose-v6.yml gost.sql release-assets/
          cd release-assets
          sha256sum gost-* *.sh *.yml *.sql > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  smoke:
    needs: [validate, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start built images with a disposable MySQL database
        env:
          IMAGE_PREFIX: ${{ needs.validate.outputs.images }}
        run: |
          cat > .env <<EOF
          DB_NAME=gost
          DB_USER=gost
          DB_PASSWORD=ci-disposable-database-only
          JWT_SECRET=ci-disposable-jwt-only-never-deploy
          BACKEND_PORT=6365
          FRONTEND_PORT=6366
          EOF
          cat > /tmp/ci-images.yml <<EOF
          services:
            backend:
              image: $IMAGE_PREFIX/springboot-backend:sha-$GITHUB_SHA
            frontend:
              image: $IMAGE_PREFIX/vite-frontend:sha-$GITHUB_SHA
          EOF
          docker compose -f docker-compose-v4.yml -f /tmp/ci-images.yml --env-file .env up -d
          for i in $(seq 1 90); do
            if curl -fsS -X POST http://localhost:6366/api/v1/service-center/self > /tmp/api.json; then
              if python3 -c 'import json; assert json.load(open("/tmp/api.json"))["code"] == 401'; then
                curl -fsS http://localhost:6366/ | grep -q '<div id="root"'
                docker compose -f docker-compose-v4.yml --env-file .env exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot gost -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (\"service_plan\",\"service_action\",\"service_operation_lock\",\"service_renewal_request\")"' | grep -qx 4
                exit 0
              fi
            fi
            sleep 2
          done
          exit 1
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose-v4.yml --env-file .env logs --tail=100
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose -f docker-compose-v4.yml --env-file .env down -v

  publish:
    needs: [validate, images, node, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned images and complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          IMAGE_PREFIX: ${{ needs.validate.outputs.images }}
        run: |
          cd release-assets && sha256sum -c SHA256SUMS && cd ..
          cat > /tmp/release-notes.md <<EOF
          ## TMS Service Center $VERSION

          线路详情、用户自助中心、套餐模板、批量分配、人工续期、站内提醒和操作记录；无在线支付。

          ### 镜像（AMD64 / ARM64）
          - \`$IMAGE_PREFIX/springboot-backend:$VERSION\`
          - \`$IMAGE_PREFIX/vite-frontend:$VERSION\`

          ### 安装
          下载本 Release 的 \`panel_install.sh\` 安装面板；节点在面板新增后，通过安装入口生成命令。
          \`gost-amd64\` 和 \`gost-arm64\` 为 Linux 节点文件，\`SHA256SUMS\` 用于校验下载。

          ### 验证
          23 项后端回归测试、双架构镜像构建、节点交叉编译及临时 MySQL + 前后端容器启动检查通过。
          真实节点和客户端链路仍需部署后验证。

          源码提交：$GITHUB_SHA
          EOF
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --draft --title "TMS Service Center $VERSION" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$VERSION" release-assets/* --clobber
          for component in springboot-backend vite-frontend; do
            docker buildx imagetools create --tag "$IMAGE_PREFIX/$component:$VERSION" --tag "$IMAGE_PREFIX/$component:latest" "$IMAGE_PREFIX/$component:sha-$GITHUB_SHA"
          done
          gh release edit "$VERSION" --draft=false --latest --notes-file /tmp/release-notes.md
