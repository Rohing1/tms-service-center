[package]
name = "tms-desktop"
version = "1.0.0"
description = "TMS Service Center desktop client"
authors = ["Rohing"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
open = "5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
